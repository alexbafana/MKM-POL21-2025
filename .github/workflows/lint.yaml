name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      # package.json pins "packageManager": "yarn@3.2.3", which only takes effect through
      # Corepack. Without this the runner's global Yarn Classic (1.22.x) refuses to install.
      # Must run AFTER setup-node: Corepack writes its shims into the Node install that is on
      # PATH at that moment, so enabling it earlier leaves the shims behind the Node that
      # setup-node then replaces. corepack is installed explicitly rather than relying on the
      # copy bundled with Node, because node-version is the floating "lts/*" and recent Node
      # releases no longer ship Corepack.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable
      
      # "yarn deploy" is a direct ts-node entry point (ts-node scripts/runHardhatDeployWithPK.ts),
      # and ts-node type-checks by default. It imports hardhat's config, which imports
      # tasks/grant-owner.ts, which references ../typechain-types -- generated by `hardhat compile`
      # and therefore absent on a fresh clone. Hardhat's own commands are unaffected because
      # Hardhat 2.x runs ts-node in transpileOnly mode unless --typecheck is passed; this makes the
      # direct entry point behave the same way. Type checking still happens in the dedicated
      # check-types steps.
      - name: Run hardhat node, deploy contracts (& generate contracts typescript output)
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
        run: yarn chain & yarn deploy

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types